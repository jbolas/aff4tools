[package]
name = "aff4tools-ffi"
version = "0.1.0"
edition.workspace = true
description = "C ABI for aff4tools: access AFF4 containers from C"
license.workspace = true
repository.workspace = true

# Depends on `aff4tools` by path, so it cannot reach crates.io before the root
# crate does. Marked explicitly rather than left to a mistaken `cargo publish`.
publish = false

# The artifact must be `libaff4.{dylib,so,dll}`, not `libaff4tools_ffi.*`.
[lib]
name = "aff4"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Mirrors the library's gate: corpus tests read the reference corpus and are off by
# default, so a green run without fixtures never means "the ABI was verified".
corpus = []

[dependencies]
aff4tools = { path = ".." }
