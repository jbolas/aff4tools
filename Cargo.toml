# The FFI crate is a workspace member rather than part of this crate.
[workspace]
members = ["aff4tools-ffi"]

# Metadata both crates share, so the URL, license, edition, and minimum Rust
# live in exactly one place and cannot drift apart between the library and its
# C ABI.
#
# `rust-version` is the highest any dependency declares (`sha2` 0.11 and `zip`
# 9 both need 1.88), and the crate's own `let` chains need it too. Raise it when
# a dependency update does; `docs/tutorial-compiling.md` states the same figure.
[workspace.package]
repository = "https://github.com/jbolas/aff4tools"
license = "MIT"
edition = "2024"
rust-version = "1.88"

[package]
name = "aff4tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Rust implementation for access to AFF4 and AFF4-L evidence files"
authors = ["Jeffrey Bolas"]
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
corpus = []

# Capabilities that exist to build proposed Canonical Reference Images for
# AFF4-L Standard v1.0-ALPHA, and are not offered to users. Some of them write
# output this tool's own `conformance` would fault.
nonconforming = []

[dependencies]
blake2 = "0.11"
# BLAKE3. Named by no AFF4 document; written as aff4:BLAKE3 in the base
# namespace, following v1.0a's own precedent of carrying aff4:blake2b there.
#
# Licensed CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception.
#
blake3 = "1.5"
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5"
# OS randomness for volume UUIDs. The version `zip` uses; `oxrdf`'s `rand`
# still carries 0.3.
getrandom = "0.4"
flate2 = "1.1.9"
lz4_flex = "0.14.0"
md-5 = "0.11"
# RDF term types (IRI, Literal, Triple) produced by oxttl.
oxrdf = "0.3"
# Streaming RDF Turtle parser; reads `information.turtle`.
oxttl = "0.2"
# `derive` annotates the model types for `--format json`.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha1 = "0.11"
# The hardware backends (x86 SHA-NI and AVX2, AArch64 SHA-2 and SHA-3
# extensions) are always compiled in, written with intrinsics rather than
# assembly, and chosen at runtime with a software fallback. No feature
# selects them, and the recorded digests are the same on every path.
sha2 = "0.11"
# SHA-3 and SHAKE, for AFF4-L v1.0-ALPHA §4.4. 0.12 is the release on the
# same `digest` 0.11 traits as the other hash crates. Licensed MIT OR Apache-2.0.
sha3 = "0.12"
# SHAKE128 and SHAKE256, for AFF4-L v1.0-ALPHA §4.4. Split out of `sha3` at 0.12
# into its own RustCrypto crate. Licensed MIT OR Apache-2.0.
shake = "0.1"
snap = "1.1.2"
# Derives std::error::Error for the crate's typed Error enum.
thiserror = "2"

# Extended attribute enumeration for AFF4-L v1.0-ALPHA §4.3.
#
# Its only dependency is `libc`, already in the tree. Licensed MIT OR
# Apache-2.0.
xattr = "1.6"

# ZIP archive access. AFF4 containers are ZIP files.
#
# Note on read-only enforcement: `zip::ZipWriter` compiles regardless 
# of the features selected here — writing cannot be disabled at the 
# dependency level. It is denied instead by clippy.
#
# **Library code must never use ZipWriter**. Test
# modules may, to build synthetic archives.
#
# `default-features = false` trims unused codecs (bzip2, zstd, lzma, aes) 
# from the build.
zip = { version = "9.5", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[dev-dependencies]
# Runs the built binary as a subprocess to assert exit codes and output.
assert_cmd = "2"
# An independent digest path for tests that must not trust the library's own
# answer — e.g. recomputing the metadata integrity hash from stored bytes.
sha2 = "0.11"
oxttl = "0.2"
# Composable output assertions, pairs with assert_cmd.
predicates = "3"
serde_json = "1"
# Temp dirs for mutated-copy tests; corpus fixtures are never touched.
tempfile = "3"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Optimize dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
