# The FFI crate is a workspace member rather than part of this crate.
[workspace]
members = ["aff4tools-ffi"]

# Metadata both crates share, so the URL, license, and edition live in exactly
# one place and cannot drift apart between the library and its C ABI.
[workspace.package]
repository = "https://github.com/jbolas/aff4tools"
license = "MIT"
edition = "2024"

[package]
name = "aff4tools"
version = "0.1.0"
edition.workspace = true
description = "Rust implementation for access to AFF4 and AFF4-L evidence files"
authors = ["Jeffrey Bolas"]
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["hash-asm"]
corpus = []

# Capabilities that exist to build proposed Canonical Reference Images for
# AFF4-L Standard v1.0-ALPHA, and are not offered to users. Some of them write
# output this tool's own `conformance` would fault, which is why the feature is
# named for what it provides rather than for its use case.
#
# What the feature gates is the **command-line interface**: off by default, no
# shipped binary offers these flags, so no shipped binary writes such a
# container in response to anything a user can type. That is what matters for a
# tool whose output supports evidentiary claims, and is why this is a feature
# rather than a hidden flag.
#
# It does not gate the library. The corresponding `LogicalOptions` fields stay
# public and ungated in every build, so a program linking this crate can ask for
# them deliberately. Gating them would fracture the library's API for downstream
# crates, `aff4tools-ffi` among them, and `StorageForm::OwnMap` is in any case a
# conforming AFF4-L v1.0-ALPHA §6.3 form — the only one able to carry the
# §6.3.1 block map hash — so it must remain reachable.
nonconforming = []

# Compiles the hardware SHA-2 paths, by enabling `sha2`'s `asm` feature.
#
# A default, so an ordinary build reaches the CPU's hash instructions.
# `--no-default-features` gives a build with no C-compiler requirement, which is
# the escape hatch for a constrained build host.
#
# **The effect is not uniform.** On aarch64 this is the only route to the
# hardware path. On x86 the SHA-NI path compiles in regardless, and this only
# upgrades the software fallback for CPUs predating it. Detection is at runtime
# with a software fallback either way, so the binary stays correct on any CPU
# and the recorded digests never change.
#
# Named as this crate's own feature rather than reaching `sha2/asm` at the use
# site because `cfg!` can read a feature of this crate but not of a dependency,
# and `crate::cpu` needs to state what was compiled in.
hash-asm = ["sha2/asm"]

# An Header, Dictionary, Triples measurement harness.
# Off by default and deliberately inert — enabling it adds one `examples/`
# binary and changes no library or CLI behavior whatsoever. `Graph` remains the
# only metadata representation the tool uses. This exists to produce numbers
# that decide whether phase H2 (an interchangeable backend) is worth building.
hdt-experiment = ["dep:hdt"]

[dependencies]
blake2 = "0.10"
# BLAKE3. Named by no AFF4 document; written as aff4:BLAKE3 in the base
# namespace, following v1.0a's own precedent of carrying aff4:blake2b there.
#
# Licensed CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception. Any of the
# three suits this project; cargo-deny elects the LLVM-exception option, which
# the allow list already carries. No NOTICE entry is needed: that file lists
# only crates offering no MIT-or-equivalent option, and CC0 is public domain.
#
# Brings arrayvec (MIT OR Apache-2.0) and constant_time_eq (CC0-1.0 OR MIT-0 OR
# Apache-2.0), and compiles blake3_neon.c on aarch64, so a C compiler is already
# a build requirement here.
blake3 = "1.5"
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5"
# Runtime CPU feature detection, so `crate::cpu` can report whether this machine
# has the hash instructions. Already in the tree via `sha2`; declared here
# because this crate calls it directly.
cpufeatures = "0.2"
# OS randomness for volume UUIDs. Already in the tree via `rand`.
getrandom = "0.3"
flate2 = "1.1.9"
lz4_flex = "0.14.0"
md-5 = "0.10"
# RDF term types (IRI, Literal, Triple) produced by oxttl.
oxrdf = "0.3"
# Streaming RDF Turtle parser; reads `information.turtle`.
oxttl = "0.2"
# `derive` annotates the model types for `--format json`.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
# SHA-3 and SHAKE, for AFF4-L v1.0-ALPHA §4.4. Pinned to 0.10 so it shares the
# `digest` 0.10 traits the rest of the tree already uses; 0.12 would pull in a
# second copy of `digest`. Licensed MIT OR Apache-2.0.
sha3 = "0.10"
snap = "1.1.2"
# Derives std::error::Error for the crate's typed Error enum.
thiserror = "2"
# Optional, and only for the `hdt-experiment` feature's measurement harness.
# Never reached by the library or the CLI.
#
# NOTE ON LICENSING: the `hdt` crate itself is MIT, but its dependency closure
# is not, and it is the only part of the tree that is not plainly permissive.
# Enabling this feature pulls in ntriple (AFL-3.0), resiter (MPL-2.0, weak
# file-level copyleft), and mownstr plus the ten sophia crates (CECILL-B, a
# French license with its own attribution requirement). mem_dbg offers
# Apache-2.0 OR LGPL-2.1-or-later; the Apache option is the one taken.
#
# None of this reaches a default build, which is wholly MIT/Apache/BSD/Zlib.
# Settle the licensing before phase H2 makes an HDT backend real.
hdt = { version = "0.7", features = ["nt"], optional = true }

# Extended attribute enumeration for AFF4-L v1.0-ALPHA §4.3's
# `extendedAttribute`, read by `src/write/xattr.rs` during a logical
# acquisition.
#
# **A crate rather than the syscalls directly, and that is the point.**
# `src/lib.rs` denies `unsafe_code` with exactly one audited exception, which
# `tests/read_only_guard.rs` enforces by counting the annotations as text.
# Binding `listxattr` and `getxattr` here would need a second exception and
# weaken that audit for two read-only calls. This crate does the same job behind
# a safe API.
#
# Its only dependency is `libc`, already in the tree. Licensed MIT OR
# Apache-2.0.
xattr = "1.6"

# ZIP archive access. AFF4 containers are ZIP files.
#
# NOTE ON READ-ONLY: `zip::ZipWriter` is NOT feature-gated and compiles
# regardless of the settings here — writing cannot be disabled at the
# dependency level. Read-only is enforced by clippy.toml's
# disallowed-methods list, the crate-root lints in src/lib.rs, a CI grep guard,
# and the single File::open chokepoint in src/zip.rs. **Do not use ZipWriter.**
#
# `default-features = false` trims unused codecs (bzip2, zstd, lzma, aes) 
# from the build.
zip = { version = "8.6", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[dev-dependencies]
# Runs the built binary as a subprocess to assert exit codes and output.
assert_cmd = "2"
# An independent digest path for tests that must not trust the library's own
# answer — e.g. recomputing the metadata integrity hash from stored bytes.
sha2 = "0.10"
oxttl = "0.2"
# Composable output assertions, pairs with assert_cmd.
predicates = "3"
serde_json = "1"
# Temp dirs for mutated-copy tests; corpus fixtures are never touched.
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Optimize dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
